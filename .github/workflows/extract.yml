name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o *.zip -d extracted
          cp -r extracted/*/* .
          rm -rf extracted
          rm -f *.zip

      - name: Commit project
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Add Smart Agro Marketplace project" || exit 0
          git push
